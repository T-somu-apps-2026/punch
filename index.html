<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ふっとびパンチ</title>
<meta name="description" content="へんな いきものを タップして ふっとばす パンチゲーム。全10ステージ。">
<meta property="og:type" content="website">
<meta property="og:title" content="ふっとびパンチ">
<meta property="og:description" content="へんな いきものを タップして ふっとばす パンチゲーム。全10ステージ。">
<meta property="og:url" content="https://t-somu-apps-2026.github.io/punch/">
<meta property="og:image" content="https://t-somu-apps-2026.github.io/punch/punch-cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap">
<style>
/* Layout: full-screen meadow canvas; slim HUD on top (stage, progress, remaining); overlays for title and stage clear. Single bright cartoon theme by choice. */
:root{
  --sky:#bfe9ff; --ink:#2d2340; --btn:#ffd23f; --pink:#ff5c8a; --paper:#ffffff;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hud{display:flex;align-items:center;gap:8px;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.badge{background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:3px 12px;font-weight:800;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{flex:1;min-width:0;height:16px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pink);transition:width .25s}
.field{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(191,233,255,.55)}
.overlay h1{margin:0;font-size:clamp(38px,11vw,64px);font-weight:800;line-height:1.1;color:var(--pink);
  -webkit-text-stroke:2px var(--ink);text-shadow:0 5px 0 var(--ink);text-wrap:balance}
.overlay h2{margin:0;font-size:clamp(30px,9vw,48px);font-weight:800;color:var(--pink);-webkit-text-stroke:1.5px var(--ink);text-shadow:0 4px 0 var(--ink)}
.overlay p{margin:0;font-size:18px;font-weight:800;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:8px 16px;max-width:30ch}
.stars{font-size:40px;letter-spacing:6px}
.big{font-family:var(--font);font-weight:800;font-size:22px;padding:14px 34px;border-radius:999px;border:4px solid var(--ink);
  background:var(--btn);color:var(--ink);box-shadow:0 6px 0 rgba(45,35,64,.3);cursor:pointer}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(45,35,64,.3)}
.home{cursor:pointer;font-family:var(--font);color:var(--ink);padding:3px 10px}
.pick{font-weight:800;font-size:16px}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:330px}
.sbtn{font-family:var(--font);font-weight:800;font-size:20px;aspect-ratio:1;border-radius:16px;border:3px solid var(--ink);background:var(--paper);color:var(--ink);
  box-shadow:0 4px 0 rgba(45,35,64,.25);cursor:pointer;position:relative;padding:0}
.sbtn.last{background:#ffd0e0}
.sbtn .st{position:absolute;top:-10px;right:-8px;font-size:16px}
.small{font-family:var(--font);font-weight:800;font-size:16px;padding:8px 20px;border-radius:999px;border:3px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
button:focus-visible{outline:4px solid #4a90e2;outline-offset:3px}
</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <button class="badge home" id="home" type="button" aria-label="ステージをえらぶ">◀</button>
    <span class="badge" id="stg">ステージ 1/10</span>
    <div class="bar"><i id="prog"></i></div>
    <span class="badge" id="left">のこり 5</span>
  </div>
  <div class="field" id="field">
    <canvas id="cv"></canvas>
    <div class="overlay" id="title">
      <h1>ふっとび<br>パンチ</h1>
      <p>へんな いきものを タップして ふっとばそう！</p>
      <button class="big" id="start" type="button">スタート</button>
      <div class="pick">ステージを えらぶ</div>
      <div class="stages" id="stages"></div>
    </div>
    <div class="overlay" id="clear" hidden>
      <h2 id="clearText">ステージ1 クリア！</h2>
      <div class="stars">⭐⭐⭐</div>
      <button class="big" id="next" type="button">つぎへ ▶</button>
      <button class="small" id="toSel" type="button">ステージを えらぶ</button>
    </div>
  </div>
</div>

<script>
const INK='#2d2340';
const field=document.getElementById('field'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=300,H=500,U=300;
function fit(){const r=field.getBoundingClientRect();if(!r.width||!r.height)return;W=r.width;H=r.height;U=Math.min(W,H*0.8);
  const d=window.devicePixelRatio||1;cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0)}
try{new ResizeObserver(fit).observe(field)}catch(e){window.addEventListener('resize',fit)}
fit();

// ---------- stages ----------
// eq: chance of wearing things, eqMax: how many, split: chance of splitting, gen: how many times it splits
const STAGES=[
 {n:5,on:1,sp:.35,eq:0,eqMax:0,split:0,gen:1},
 {n:6,on:2,sp:.5,eq:0,eqMax:0,split:.4,gen:1},
 {n:7,on:2,sp:.6,eq:.5,eqMax:1,split:0,gen:1},
 {n:8,on:3,sp:.8,eq:.4,eqMax:1,split:.25,gen:1},
 {n:9,on:3,sp:.95,eq:.5,eqMax:2,split:.2,gen:1},
 {n:10,on:3,sp:1.1,eq:.5,eqMax:2,split:.3,gen:1},
 {n:10,on:4,sp:1.2,eq:.5,eqMax:2,split:.3,gen:2},
 {n:12,on:4,sp:1.4,eq:.6,eqMax:3,split:.3,gen:2},
 {n:12,on:5,sp:1.6,eq:.6,eqMax:3,split:.35,gen:2},
 {n:7,on:4,sp:1.1,eq:.5,eqMax:2,split:.3,gen:2}
];
// one boss at the end of every stage
const BOSSES=[
 {name:'プニプニキング',hp:3,size:.19,col:'#ff9fcb',eyes:2,deco:0,items:[]},
 {name:'トゲトゲたいしょう',hp:4,size:.2,col:'#7ee08a',eyes:1,deco:3,items:[]},
 {name:'ツノツノしょうぐん',hp:5,size:.2,col:'#ff9f43',eyes:2,deco:2,items:['helmet']},
 {name:'メダマだいおう',hp:5,size:.21,col:'#7ed6ff',eyes:3,deco:1,items:['glasses']},
 {name:'ナベかぶりおう',hp:6,size:.21,col:'#ffd23f',eyes:2,deco:0,items:['ring','pot']},
 {name:'ブンレツおやぶん',hp:6,size:.22,col:'#5ce1c6',eyes:2,deco:3,items:[],split:1},
 {name:'プロペラばんちょう',hp:7,size:.22,col:'#ff6b6b',eyes:1,deco:0,items:['glasses','propeller'],fast:true},
 {name:'コーンだいまおう',hp:8,size:.23,col:'#b388ff',eyes:3,deco:2,items:['ring','cone']},
 {name:'キラキラこうてい',hp:9,size:.24,col:'#ffb3e6',eyes:2,deco:1,items:['ring','glasses','helmet']},
 {name:'ラスボス ムニョーン',hp:12,size:.26,col:'#9b6bff',eyes:3,deco:2,items:['ring','glasses','pot']}
];
// extra boss: when beaten it bursts into lots of minions
const POKO={name:'ザコだらけ ポコポコ',hp:6,size:.22,col:'#ffa94d',eyes:3,deco:1,items:['ring'],burst:12};
const POKO_STAGE=6;
function stageBosses(i){return i===POKO_STAGE?[BOSSES[i],POKO]:i===9?[BOSSES[i],POKO,POKO]:[BOSSES[i]]}
let bossOut=false;
const HEADS=['helmet','pot','cone','propeller'];
const ITEM_OFF={helmet:-.85,pot:-.95,cone:-1.05,propeller:-.95,glasses:-.15,ring:.5};
const ITEM_NAME={helmet:'ヘルメット',pot:'おなべ',cone:'コーン',propeller:'プロペラ',glasses:'サングラス',ring:'うきわ'};
let need=5;
const COLORS=['#ff7eb6','#7ed6ff','#b388ff','#ffd23f','#7ee08a','#ff9f43','#5ce1c6','#ff6b6b','#a0e7ff','#ffb3e6'];
const WORDS=['ドカッ！','バシッ！','ボヨーン！','ポコッ！','ズドン！','ペチッ！'];
let si=0,knocked=0,spawned=0,mode='title',cs=[],parts=[],pows=[],shake=0,spawnDelay=0,gap=0,banner=null,clouds=[];
for(let i=0;i<4;i++)clouds.push({x:Math.random(),y:.08+Math.random()*.3,s:.6+Math.random()*.6,v:.00015+Math.random()*.0002});

const rnd=a=>a[Math.floor(Math.random()*a.length)];
function shade(hex,a){const p=hex.match(/\w\w/g).map(h=>parseInt(h,16)),t=a<0?0:255,k=Math.abs(a);
 return'#'+p.map(v=>Math.round(v+(t-v)*k).toString(16).padStart(2,'0')).join('')}

function makeC(o){const S=STAGES[si];
 return Object.assign({r:.11*U,hp:1,max:1,boss:false,demo:false,items:[],split:0,
  col:rnd(COLORS),k:rnd([3,4,5,6,7]),amp:.05+Math.random()*.08,ph:Math.random()*6,
  eyes:1+Math.floor(Math.random()*3),deco:Math.floor(Math.random()*4),mouth:Math.floor(Math.random()*3),
  ang:Math.random()*6.28,sp:S.sp*(.8+Math.random()*.4),pitch:.85+Math.random()*.4,
  st:'in',t:0,s:0,rot:0,vr:0,vx:0,vy:0,flash:0,squash:0,turn:60+Math.random()*120,hop:Math.random()*6},o)}
function spawn(boss,demo){const S=STAGES[si];
 let split=0,items=[];
 if(!boss&&!demo&&Math.random()<S.split)split=S.gen;
 else if(!boss&&(demo||Math.random()<S.eq)){const m=demo?1+Math.floor(Math.random()*2):1+Math.floor(Math.random()*S.eqMax);
  items=[rnd(HEADS),'glasses','ring'].sort(()=>Math.random()-.5).slice(0,m)}
 const B=(boss&&boss.name)?boss:BOSSES[si];if(boss){items=[...B.items];split=B.split||0}
 const r=(boss?B.size:split===2?.13:.1+Math.random()*.025)*U,top=r+10,bottom=H*.9-r;
 cs.push(makeC({x:r+Math.random()*Math.max(1,W-2*r),y:top+Math.random()*Math.max(1,bottom-top),r,boss:!!boss,demo:!!demo,items,split,
  hp:boss?B.hp:1,max:boss?B.hp:1,name:boss?B.name:'',col:boss?B.col:rnd(COLORS),eyes:boss?B.eyes:1+Math.floor(Math.random()*3),deco:boss?B.deco:Math.floor(Math.random()*4),mouth:boss?2:Math.floor(Math.random()*3),
  sp:(demo?.4:S.sp)*(boss?(B.fast?1.2:.6):1)*(.8+Math.random()*.4),pitch:boss?.5:split?.75:.85+Math.random()*.4}));
 if(!demo&&!boss)spawned++}

// ---------- sound ----------
let ac=null,nb=null;
function A(){try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
 const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}if(ac.state==='suspended')ac.resume();return ac}catch(e){return null}}
function env(g,t,v,dur){g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur)}
function osc(type,f0,f1,t,dur,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);
 if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);env(g,t,v,dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.02)}
function noise(type,f,t,dur,v){const n=ac.createBufferSource();n.buffer=nb;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;
 const g=ac.createGain();env(g,t,v,dur);n.connect(fl).connect(g).connect(ac.destination);n.start(t,Math.random()*.5);n.stop(t+dur+.02);return fl}
function sPunch(big){if(!A())return;const t=ac.currentTime;osc('sine',big?150:210,45,t,.2,.7);noise('lowpass',big?1300:2200,t,.12,.55)}
function sWhoosh(){if(!A())return;const t=ac.currentTime,fl=noise('bandpass',300,t,.5,.35);fl.Q.value=2;fl.frequency.exponentialRampToValueAtTime(2600,t+.45)}
function sSqueak(){if(!A())return;const t=ac.currentTime,f=650+Math.random()*450;osc('triangle',f,f*1.9,t,.13,.14)}
function sTwinkle(){if(!A())return;const t=ac.currentTime;osc('sine',1568,0,t,.25,.07);osc('sine',2093,0,t+.08,.3,.07)}
function sMiss(){if(!A())return;noise('highpass',1500,ac.currentTime,.08,.08)}
function sJingle(final){if(!A())return;const t=ac.currentTime,n=final?[523,659,784,1047,784,1047,1319]:[523,659,784,1047];
 n.forEach((f,i)=>osc('triangle',f,0,t+i*.12,.25,.13))}
function sBoss(){if(!A())return;const t=ac.currentTime;osc('sawtooth',110,55,t,.7,.18);[392,370,349,311].forEach((f,i)=>osc('square',f,0,t+.15+i*.16,.18,.06))}
function sPop(){if(!A())return;const t=ac.currentTime;osc('sine',300,900,t,.12,.3);osc('sine',900,300,t+.1,.12,.2)}
// 10 funny voices: vowel formants + pitch slides
const FORM={a:[800,1200],i:[300,2300],u:[350,1250],e:[500,1900],o:[480,850]};
const VOICES=[
 {t:'ぷぎゃっ！',seg:[['u',400,500,.07],['a',700,330,.2]]},
 {t:'ほえ〜！',vib:7,seg:[['o',350,420,.13],['e',420,240,.38]]},
 {t:'むぎゅ！',seg:[['u',300,280,.1],['i',500,720,.08],['u',600,300,.12]]},
 {t:'ぴゃー！',seg:[['i',800,1100,.08],['a',1100,650,.32]]},
 {t:'ぶべっ！',w:'square',seg:[['u',230,190,.09],['e',270,160,.16]]},
 {t:'あわわわ',gap:.03,seg:[['a',500,540,.08],['a',540,470,.08],['a',480,520,.08],['a',500,380,.13]]},
 {t:'うにょ〜ん',vib:9,seg:[['u',330,520,.15],['o',520,280,.32]]},
 {t:'ぎゃぴっ！',seg:[['a',600,900,.1],['i',1000,1350,.09]]},
 {t:'へぶしっ！',gap:.02,seg:[['e',450,380,.1],['u',380,300,.08],['i',700,950,.08]]},
 {t:'ぽよよ〜ん',seg:[['o',400,620,.08],['o',620,400,.08],['o',400,620,.08],['o',620,250,.26]]}
];
function sVoice(v,pm){if(!A())return;try{const t0=ac.currentTime+.01;let t=t0;
 const o=ac.createOscillator();o.type=v.w||'sawtooth';const out=ac.createGain();out.gain.setValueAtTime(.0001,t0);
 const f1=ac.createBiquadFilter(),f2=ac.createBiquadFilter();f1.type='bandpass';f2.type='bandpass';f1.Q.value=5;f2.Q.value=7;
 const g1=ac.createGain(),g2=ac.createGain(),dry=ac.createGain();g1.gain.value=3.2;g2.gain.value=2;dry.gain.value=.12;
 o.connect(f1).connect(g1).connect(out);o.connect(f2).connect(g2).connect(out);o.connect(dry).connect(out);out.connect(ac.destination);
 if(v.vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=v.vib;lg.gain.value=25*pm;l.connect(lg).connect(o.frequency);l.start(t0);l.stop(t0+1.5)}
 v.seg.forEach(([vw,a,b,d])=>{const F=FORM[vw];o.frequency.setValueAtTime(a*pm,t);o.frequency.exponentialRampToValueAtTime(b*pm,t+d);
  f1.frequency.setValueAtTime(F[0],t);f2.frequency.setValueAtTime(F[1],t);
  out.gain.setValueAtTime(.0001,t);out.gain.exponentialRampToValueAtTime(.45,t+.015);out.gain.setValueAtTime(.45,t+d-.03);out.gain.exponentialRampToValueAtTime(.0001,t+d);
  t+=d+(v.gap||0)});
 o.start(t0);o.stop(t+.05)}catch(e){}}

// ---------- HUD / flow ----------
const $=id=>document.getElementById(id);
function hud(){$('stg').textContent='ステージ '+(si+1)+'/10';$('prog').style.width=(knocked/need*100)+'%';$('left').textContent='のこり '+Math.max(0,need-knocked)}
function startStage(i){si=i;knocked=0;spawned=0;need=STAGES[i].n+stageBosses(i).length;bossOut=false;cs=[];pows=[];mode='play';spawnDelay=75;gap=0;
 banner={text:'ステージ '+(i+1),sub:stageBosses(i).length>1?'ボスが '+stageBosses(i).length+'ひき かくれてるぞ！':'ボスが かくれてるぞ！',life:1.3};$('title').hidden=true;$('clear').hidden=true;hud()}
$('start').onclick=()=>{A();startStage(0)};
let cleared={};try{cleared=JSON.parse(localStorage.getItem('punchCleared')||'{}')}catch(e){}
function renderStages(){const g=$('stages');g.innerHTML='';for(let i=0;i<10;i++){const b=document.createElement('button');b.type='button';
 b.className='sbtn'+(i===9?' last':'');b.id='stage-'+(i+1);b.innerHTML=(i+1)+(cleared[i]?'<span class="st">⭐</span>':'');
 b.setAttribute('aria-label','ステージ'+(i+1));b.onclick=()=>{A();startStage(i)};g.appendChild(b)}}
renderStages();
function toTitle(){mode='title';cs=[];pows=[];banner=null;for(let i=0;i<3;i++)spawn(false,true);$('clear').hidden=true;$('title').hidden=false;renderStages()}
$('home').onclick=toTitle;$('toSel').onclick=toTitle;
$('next').onclick=()=>{A();startStage(si>=9?0:si+1)};
function showClear(){cleared[si]=1;try{localStorage.setItem('punchCleared',JSON.stringify(cleared))}catch(e){}const last=si===9;$('clearText').textContent=last?'ぜんぶ クリア！':'ステージ'+(si+1)+' クリア！';
 $('next').textContent=last?'もういちど あそぶ':'つぎへ ▶';$('clear').hidden=false;sJingle(last);
 for(let i=0;i<40;i++)parts.push({k:'confetti',x:Math.random()*W,y:-20-Math.random()*H*.3,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,
  rot:Math.random()*6,vr:(Math.random()-.5)*.3,col:rnd(COLORS),life:3})}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{if(mode!=='play')return;e.preventDefault();A();
 const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
 for(let i=cs.length-1;i>=0;i--){const c=cs[i];if(c.st==='fly'||c.st==='hide'||c.demo)continue;
  if(Math.hypot(c.x-px,c.y-py)<c.r*1.2*Math.max(.5,c.s)){hit(c,px,py);return}}
 parts.push({k:'puff',x:px,y:py,life:1});sMiss()});

function hit(c,px,py){let dx=c.x-px,dy=c.y-py;const d=Math.hypot(dx,dy);if(d<c.r*.25){dx=Math.random()<.5?-1:1;dy=-.4}else{dx/=d;dy/=d}
 pows.push({x:px,y:py,life:1,word:rnd(WORDS),rot:(Math.random()-.5)*.5,s:c.boss?1.3:1});
 for(let i=0;i<8;i++){const a=Math.random()*6.28,v=U*(.008+Math.random()*.012);parts.push({k:'star',x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,col:rnd(['#ffe14d','#ffffff','#ff8fb8'])})}
 shake=c.boss?10:6;const v=rnd(VOICES);sVoice(v,c.pitch);
 parts.push({k:'say',x:c.x,y:c.y-c.r*1.3,text:v.t,life:1.4});
 const knock=()=>{c.vx+=dx*U*.03;c.vy+=dy*U*.03;c.flash=1;c.squash=1;sPunch(false)};
 if(c.boss){if(Math.random()<.25&&c.hp>1)c.vis=Math.min(c.vis,12);c.hp--;if(c.atk!==undefined&&c.atk>75)c.atk=Math.max(75,c.atk-60);if(c.items.length&&c.hp<=c.max*c.items.length/(c.items.length+1))dropItem(c,dx);if(c.hp>0){knock();return}
  if(c.split>0){c.boss=false;doSplit(c);sPunch(true);shake=20;return}}
 else if(c.split>0){doSplit(c);sPunch(false);return}
 else if(c.items.length){dropItem(c,dx);knock();return}
 c.st='fly';const sp=U*(c.boss?.03:.05),side=dx>=0?1:-1;c.vx=dx*sp+side*U*.01;c.vy=Math.min(dy,-.5)*sp-U*.015;c.vr=side*.35;
 sPunch(true);sWhoosh();if(c.boss)shake=20;if(c.burst)zakoBurst(c)}

 cs.forEach(c=>{if(c.st!=='hide')drawC(c)});
 parts.forEach(p=>{ctx.globalAlpha=Math.max(0,Math.min(1,p.life));
  if(p.k==='star'){ctx.fillStyle=p.col;ctx.strokeStyle=INK;ctx.lineWidth=2;starPath(p.x,p.y,4,U*.025,U*.01);ctx.fill();ctx.stroke()}
  else if(p.k==='item'){ctx.globalAlpha=1;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.translate(0,-p.off*p.r);drawItem(p.type,p.r,p.t,true);ctx.restore()}
  else if(p.k==='say'){ctx.globalAlpha=Math.min(1,p.life*2);const fs=U*(p.small?.05:.065);ctx.font=F(fs);ctx.textAlign='center';ctx.textBaseline='middle';
   ctx.lineJoin='round';const tx=Math.max(fs*3,Math.min(W-fs*3,p.x)),ty=Math.max(fs,p.y);
   ctx.lineWidth=7;ctx.strokeStyle='#fff';ctx.strokeText(p.text,tx,ty);ctx.fillStyle=p.small?'#3a6fe0':'#8a3ffc';ctx.fillText(p.text,tx,ty)}
  else if(p.k==='twinkle'){const s=U*.08*(1.3-p.life*.6);ctx.fillStyle='#ffe14d';ctx.strokeStyle=INK;ctx.lineWidth=3;
   ctx.save();ctx.translate(p.x,p.y);ctx.rotate((1-p.life)*3);starPath(0,0,4,s,s*.3);ctx.fill();ctx.stroke();ctx.restore();
   ctx.font=F(U*.06);ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#fff';const ty=Math.min(H-20,Math.max(U*.12,p.y-s-8));
   ctx.strokeText('キラーン',Math.max(U*.15,Math.min(W-U*.15,p.x)),ty);ctx.fillStyle='#ff5c8a';ctx.fillText('キラーン',Math.max(U*.15,Math.min(W-U*.15,p.x)),ty)}
  else if(p.k==='shock'){ctx.strokeStyle='#ff3b6b';ctx.lineWidth=6*p.life;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1+2*(1-p.life)),0,7);ctx.stroke()}
  else if(p.k==='smoke'){ctx.fillStyle='#ffffff';ctx.strokeStyle='#c9c3d6';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1.4-p.life*.4),0,7);ctx.fill();ctx.stroke()}
  else if(p.k==='puff'){ctx.strokeStyle='#ffffff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,U*.05*(1.5-p.life),0,7);ctx.stroke()}
  else if(p.k==='confetti'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;ctx.fillRect(-6,-3,12,6);ctx.restore()}
  ctx.globalAlpha=1});
 pows.forEach(p=>{const grow=p.life>.8?(1-p.life)/.2:1,R=U*.13*p.s*(.6+.4*grow);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.min(1,p.life*2);
  ctx.fillStyle='#ffe14d';ctx.strokeStyle=INK;ctx.lineWidth=4;starPath(0,0,10,R,R*.62);ctx.fill();ctx.stroke();
  ctx.font=F(R*.42);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#ff3b6b';ctx.fillText(p.word,0,0);
  if(p.life>.55){ctx.font=Math.round(R*.8)+'px sans-serif';ctx.fillText('👊',R*.6,R*.6)}ctx.restore()});
 if(banner){const a=Math.min(1,banner.life*3);ctx.globalAlpha=a;ctx.font=F(Math.min(W*.13,U*.15));ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineWidth=10;ctx.strokeStyle='#fff';ctx.strokeText(banner.text,W/2,H*.42);ctx.fillStyle='#ff5c8a';ctx.fillText(banner.text,W/2,H*.42);
  if(banner.sub){ctx.font=F(Math.min(W*.075,U*.085));ctx.lineWidth=8;ctx.strokeText(banner.sub,W/2,H*.42+U*.14);ctx.fillStyle='#8a3ffc';ctx.fillText(banner.sub,W/2,H*.42+U*.14)}ctx.globalAlpha=1}
 ctx.restore();
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
